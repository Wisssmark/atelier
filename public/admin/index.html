<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier — Admin</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- Login -->
  <div id="login" class="login">
    <form class="login-card" id="loginForm">
      <div class="login-brand">ATELIER<span>.admin</span></div>
      <p class="login-sub">Sign in to manage your content</p>
      <input name="username" placeholder="Username" autocomplete="username" required />
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="login-err" id="loginErr"></p>
      <p class="login-hint">Default: <code>admin</code> / <code>admin123</code> — change it after first login.</p>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="side-brand">ATELIER<span>.admin</span></div>
      <nav class="side-nav" id="sideNav">
        <button data-view="dashboard" class="active">Overview</button>
        <button data-view="posts">Journal / Blog</button>
        <button data-view="projects">Portfolio</button>
        <button data-view="gallery">Gallery</button>
        <button data-view="stats">Statistics</button>
        <button data-view="messages">Messages</button>
        <button data-view="settings">Site Settings</button>
        <button data-view="account">Account</button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank">View site ↗</a>
        <button id="logoutBtn">Log out</button>
      </div>
    </aside>
    <main class="content" id="content"><!-- views injected --></main>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
